name: Android CI

on:
  push:
    branches: [ master ]
    tags-ignore: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37.2
        run: yes | sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; release APK will be signed with the debug key and not published."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew testDebugUnitTest assembleDebug
          else
            ./gradlew testDebugUnitTest assembleDebug assembleRelease
          fi

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/AppLock-Revived-${{ steps.version.outputs.tag }}-debug.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "dist/AppLock-Revived-${{ steps.version.outputs.tag }}.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: dist/*-debug.apk

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: |
            dist/AppLock-Revived-${{ steps.version.outputs.tag }}.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        # Only publish signed builds from master, once per versionName.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump versionName/versionCode to publish a new one."
            exit 0
          fi
          notes_file=fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          if [ -f "$notes_file" ]; then
            notes_arg=(--notes-file "$notes_file")
          else
            notes_arg=(--generate-notes)
          fi
          grep -v -- '-debug.apk' dist/SHA256SUMS.txt > dist/AppLock-Revived-$TAG.apk.sha256
          gh release create "$TAG" "dist/AppLock-Revived-$TAG.apk" "dist/AppLock-Revived-$TAG.apk.sha256" \
            --title "App Lock Revived $TAG" \
            --target "$GITHUB_SHA" \
            --latest \
            "${notes_arg[@]}"
